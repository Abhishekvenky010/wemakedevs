[package]
name = "risk_agent_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
falkordb = { version = "0.10.4", features = ["tokio", "tokio-rustls"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full", "macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors"] }