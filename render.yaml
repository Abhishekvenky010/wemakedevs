services:
  - type: web
    name: agentx-backend
    runtime: docker
    dockerfilePath: ./risk_agent_backend/Dockerfile
    dockerContext: ./risk_agent_backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FALKORDB_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
